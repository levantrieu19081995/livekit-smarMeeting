spring:
  datasource:
    # url: ${DB_URL:jdbc:postgresql://localhost:5432/meeting_db}
    # username: ${DB_USERNAME:meeting_user}
    # password: ${DB_PASSWORD:meeting_password}
    # Nếu chạy docker
    # url: jdbc:postgresql://127.0.0.1:5433/meeting_db

    url: jdbc:postgresql://127.0.0.1:5432/meeting_db
    username: meeting_user
    password: meeting_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

livekit:
  url: ${LIVEKIT_URL:ws://172.16.20.177:7880}
  api-key: ${LIVEKIT_API_KEY:devkey}
  api-secret: ${LIVEKIT_API_SECRET:secret}
  empty-timeout: ${LIVEKIT_EMPTY_TIMEOUT:3600}
  departure-timeout: ${LIVEKIT_DEPARTURE_TIMEOUT:300}

ai-service:
  base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  internal-api-key: ${AI_INTERNAL_API_KEY:dev-ai-key}
  connect-timeout-seconds: 5
  read-timeout-seconds: 180

frontend:
  base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

  allowed-origins:
    - ${FRONTEND_ALLOWED_ORIGIN:http://localhost:3000}
    - ${FRONTEND_ALLOWED_ORIGIN_LAN:http://172.16.1.229:3000}

  allowed-origin-patterns:
    - ${FRONTEND_ALLOWED_ORIGIN_PATTERN:https://*.cusc.vn}

storage:
  upload-dir: ${STORAGE_UPLOAD_DIR:uploads}